name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ============================================================================
  # Windows Build (OpenGL - always tested)
  # ============================================================================
  build-windows-opengl:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Configure CMake (Windows OpenGL)
      run: |
        cmake -B build -G "Visual Studio 17 2022" `
          -DEASYGPU_BACKEND=OpenGL `
          -DEASYGPU_BUILD_TESTS=ON `
          -DEASYGPU_BUILD_EXAMPLES=ON `
          -DEASYGPU_BUILD_WINDOW=ON `
          -DEASYGPU_BUILD_WINDOW_EXAMPLES=ON
    
    - name: Build (Windows OpenGL)
      run: cmake --build build --config Release --parallel
    
    - name: Run Tests (Windows OpenGL)
      run: |
        cd build
        ctest -C Release --output-on-failure

  # ============================================================================
  # Windows Build (Vulkan - optional, may fail if SDK unavailable)
  # ============================================================================
  build-windows-vulkan:
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Install Vulkan SDK (Windows)
      uses: humbletim/install-vulkan-sdk@v1.1.1
      with:
        version: 1.3.268.0
        cache: true
    
    - name: Configure CMake (Windows Vulkan)
      run: |
        cmake -B build -G "Visual Studio 17 2022" `
          -DEASYGPU_BACKEND=Vulkan `
          -DEASYGPU_BUILD_TESTS=ON `
          -DEASYGPU_BUILD_EXAMPLES=ON `
          -DEASYGPU_BUILD_WINDOW=ON
    
    - name: Build (Windows Vulkan)
      run: cmake --build build --config Release --parallel

  # ============================================================================
  # Ubuntu Build (OpenGL with Window)
  # ============================================================================
  build-ubuntu-opengl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libx11-dev \
          xorg-dev
    
    - name: Configure CMake (Ubuntu OpenGL)
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEASYGPU_BACKEND=OpenGL \
          -DEASYGPU_BUILD_TESTS=ON \
          -DEASYGPU_BUILD_EXAMPLES=ON \
          -DEASYGPU_BUILD_WINDOW=ON \
          -DEASYGPU_BUILD_WINDOW_EXAMPLES=ON
    
    - name: Build (Ubuntu OpenGL)
      run: cmake --build build --parallel $(nproc)
    
    - name: Run Tests (Ubuntu OpenGL)
      run: |
        cd build
        ctest --output-on-failure

  # ============================================================================
  # Ubuntu Build (OpenGL Headless)
  # ============================================================================
  build-ubuntu-headless:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Ubuntu - Headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libx11-dev
    
    - name: Configure CMake (Headless)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEASYGPU_BACKEND=OpenGL \
          -DEASYGPU_BUILD_TESTS=ON \
          -DEASYGPU_BUILD_EXAMPLES=ON \
          -DEASYGPU_BUILD_WINDOW=OFF
    
    - name: Build (Headless)
      run: cmake --build build --parallel $(nproc)
    
    - name: Run Tests (Headless)
      run: |
        cd build
        ctest --output-on-failure

  # ============================================================================
  # Ubuntu Build (Vulkan - optional, may fail if SDK unavailable)
  # ============================================================================
  build-ubuntu-vulkan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libx11-dev \
          xorg-dev \
          python3 \
          git
    
    - name: Install Vulkan SDK (Ubuntu)
      run: |
        # Install Vulkan Headers
        curl -LO https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.3.268.tar.gz
        tar xzf v1.3.268.tar.gz
        cd Vulkan-Headers-1.3.268
        cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo cmake --install build
        cd ..
        # Build and install glslang
        git clone --depth 1 --branch sdk-1.3.268.0 https://github.com/KhronosGroup/glslang.git
        cd glslang
        ./update_glslang_sources.py
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
        cmake --build build --parallel $(nproc)
        sudo cmake --install build
        cd ..
    
    - name: Configure CMake (Ubuntu Vulkan)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEASYGPU_BACKEND=Vulkan \
          -DEASYGPU_BUILD_TESTS=ON \
          -DEASYGPU_BUILD_EXAMPLES=ON \
          -DEASYGPU_BUILD_WINDOW=ON
    
    - name: Build (Ubuntu Vulkan)
      run: cmake --build build --parallel $(nproc)

  # ============================================================================
  # Code Formatting Check
  # ============================================================================
  format-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format
    
    - name: Check Formatting
      run: |
        find include source -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
      continue-on-error: true
