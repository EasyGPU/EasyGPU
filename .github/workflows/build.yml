name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ============================================================================
  # Windows Build (OpenGL)
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Configure CMake (Windows)
      run: |
        cmake -B build -G "Visual Studio 17 2022" `
          -DEASYGPU_BACKEND=OpenGL `
          -DEASYGPU_BUILD_TESTS=OFF `
          -DEASYGPU_BUILD_EXAMPLES=ON `
          -DEASYGPU_BUILD_WINDOW=ON `
          -DEASYGPU_BUILD_WINDOW_EXAMPLES=ON
    
    - name: Build (Windows)
      run: cmake --build build --config Release --parallel

  # ============================================================================
  # Ubuntu Build (OpenGL with Window)
  # ============================================================================
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libx11-dev \
          xorg-dev
    
    - name: Configure CMake (Ubuntu)
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEASYGPU_BACKEND=OpenGL \
          -DEASYGPU_BUILD_TESTS=OFF \
          -DEASYGPU_BUILD_EXAMPLES=ON \
          -DEASYGPU_BUILD_WINDOW=ON \
          -DEASYGPU_BUILD_WINDOW_EXAMPLES=ON
    
    - name: Build (Ubuntu)
      run: cmake --build build --parallel $(nproc)

  # ============================================================================
  # Ubuntu Build (OpenGL Headless - No Window)
  # ============================================================================
  build-ubuntu-headless:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Ubuntu - Headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgl1-mesa-dev \
          libx11-dev
    
    - name: Configure CMake (Headless)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DEASYGPU_BACKEND=OpenGL \
          -DEASYGPU_BUILD_TESTS=OFF \
          -DEASYGPU_BUILD_EXAMPLES=ON \
          -DEASYGPU_BUILD_WINDOW=OFF
    
    - name: Build (Headless)
      run: cmake --build build --parallel $(nproc)

  # ============================================================================
  # Code Formatting Check
  # ============================================================================
  format-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format
    
    - name: Check Formatting
      run: |
        find include source -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
      continue-on-error: true
